name: Deploy docs

# Manual trigger only — run it from the Actions tab ("Run workflow") or the gh CLI.
on:
  workflow_dispatch:

permissions:
  contents: write  # needed to push the built site to the gh-pages branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so mkdocs gh-deploy can update gh-pages

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install MkDocs and plugins
        run: pip install mkdocs mkdocs-material mkdocs-glightbox

      - name: Build and deploy to gh-pages
        run: mkdocs gh-deploy --force
